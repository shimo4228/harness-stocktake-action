name: "Harness Stocktake"
description: "Audit the Claude Code harness in .claude/ with harness-stocktake, track it in one issue, apply what you tick in one PR."
author: "shimo4228"
branding:
  icon: "check-square"
  color: "orange"

inputs:
  claude_code_oauth_token:
    description: "Your Claude Code OAuth token (`claude setup-token`). Set this or anthropic_api_key."
    required: false
    default: ""
  anthropic_api_key:
    description: "Your Anthropic API key. Set this or claude_code_oauth_token."
    required: false
    default: ""
  github_token:
    description: "Token for the tracked issue, the branch push and the PR. The workflow's GITHUB_TOKEN is enough."
    required: false
    default: ${{ github.token }}
  mode:
    description: "`auto` (an `issues` event applies, any other event audits), `audit` or `apply`."
    required: false
    default: "auto"
  plugin_ref:
    description: "Tag, branch or commit of harness-stocktake to run. Pinned so a plugin release never changes a run unannounced."
    required: false
    default: "v0.1.0"
  plugin_repository:
    description: "Repository that holds the harness-stocktake marketplace."
    required: false
    default: "shimo4228/harness-stocktake"
  plugin_token:
    description: "Token that can read plugin_repository. Only needed while that repository is private."
    required: false
    default: ${{ github.token }}
  claude_args:
    description: "Arguments for the Claude Code CLI. The default turns permission prompts off; Bash runs in Claude Code's sandbox and the deny rules sit in the sandbox settings, so they hold whatever you set here (see README, Sandbox and permissions)."
    required: false
    default: "--permission-mode bypassPermissions"

outputs:
  mode:
    description: "`audit` or `apply`, the work this run did"
    value: ${{ steps.mode.outputs.mode }}
  issue_number:
    description: "Number of the tracked issue"
    value: ${{ steps.sync.outputs.issue_number || steps.prepare.outputs.issue_number }}
  pr_url:
    description: "URL of the stocktake PR (apply runs)"
    value: ${{ steps.publish.outputs.pr_url }}

runs:
  using: "composite"
  steps:
    - name: Choose audit or apply
      id: mode
      shell: bash
      env:
        MODE: ${{ inputs.mode }}
        EVENT_NAME: ${{ github.event_name }}
        OAUTH: ${{ inputs.claude_code_oauth_token }}
        API_KEY: ${{ inputs.anthropic_api_key }}
      run: |
        if [ -z "$OAUTH" ] && [ -z "$API_KEY" ]; then
          echo "::error::Set claude_code_oauth_token or anthropic_api_key (your own secret)."
          exit 1
        fi
        case "$MODE" in
          auto) if [ "$EVENT_NAME" = "issues" ]; then mode=apply; else mode=audit; fi ;;
          audit|apply) mode="$MODE" ;;
          *) echo "::error::mode must be auto, audit or apply (got '$MODE')"; exit 1 ;;
        esac
        echo "mode=$mode" >> "$GITHUB_OUTPUT"
        echo "Mode: $mode"

    - name: Read the tracked issue
      id: prepare
      if: steps.mode.outputs.mode == 'apply'
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github_token }}
      run: python3 -I "$GITHUB_ACTION_PATH/scripts/stocktake.py" apply-prepare --workspace "$GITHUB_WORKSPACE"

    - name: Fetch harness-stocktake at the pinned ref
      id: plugin
      if: steps.mode.outputs.mode == 'audit' || steps.prepare.outputs.apply == 'true'
      shell: bash
      env:
        REPO: ${{ inputs.plugin_repository }}
        REF: ${{ inputs.plugin_ref }}
        TOKEN: ${{ inputs.plugin_token }}
      run: |
        dir="$RUNNER_TEMP/harness-stocktake-plugin"
        rm -rf "$dir"
        git init -q "$dir"
        git -C "$dir" remote add origin "https://github.com/$REPO.git"
        auth="$(printf 'x-access-token:%s' "$TOKEN" | base64 | tr -d '\n')"
        echo "::add-mask::$auth"
        git -C "$dir" -c http.extraheader="AUTHORIZATION: basic $auth" fetch -q --depth 1 origin "$REF"
        git -C "$dir" checkout -q FETCH_HEAD
        echo "Plugin: $REPO@$REF ($(git -C "$dir" rev-parse HEAD))"
        echo "dir=$dir" >> "$GITHUB_OUTPUT"

    # Claude Code runs every Bash command in its sandbox: writes stay in the workspace, the temp
    # dir and the uv dir, and the network reaches only PyPI (strictAllowlist denies every other
    # host). The default claude_args turn prompts off inside it, because claude -p refuses the
    # audit's commands that use shell variables. The settings' deny rules keep WebFetch, WebSearch,
    # MCP tools and the file tools' writes to protected and runner paths out (README: Sandbox and
    # permissions); deny rules hold with prompts off.
    - name: Prepare the Bash sandbox
      id: sandbox
      if: steps.plugin.outputs.dir != ''
      shell: bash
      run: |
        # macOS uses its built-in Seatbelt; Linux needs bubblewrap and socat.
        if [ "$RUNNER_OS" = "Linux" ]; then
          if ! command -v bwrap >/dev/null || ! command -v socat >/dev/null; then
            sudo apt-get update -qq && sudo apt-get install -y -qq bubblewrap socat >/dev/null
          fi
          # Ubuntu 24.04's AppArmor policy stops bubblewrap from making user namespaces.
          if [ "$(sysctl -n kernel.apparmor_restrict_unprivileged_userns 2>/dev/null)" = "1" ]; then
            sudo sysctl -q -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          bwrap --ro-bind / / --dev /dev --proc /proc true
        fi
        uv_dir="$RUNNER_TEMP/harness-stocktake-uv"
        mkdir -p "$uv_dir/cache"
        settings="$RUNNER_TEMP/harness-stocktake-settings.json"
        UV_DIR="$uv_dir" python3 -I -c '
        import json, os, sys
        # Protected paths anywhere (the apply worktree too), the command files of the runner
        # (GITHUB_ENV and the others), the Action code later steps run, and home dotfiles.
        paths = ["//**/.claude/**", "//**/.mcp.json", "//**/.claude.json", "//**/.git/**",
                 "//**/.gitmodules", "//**/.vscode/**", "//**/.devcontainer/**",
                 "//**/_runner_file_commands/**", "//**/_actions/**", "~/.*", "~/.*/**"]
        tools = ["Edit", "Write", "MultiEdit", "NotebookEdit"]
        deny = ["WebFetch", "WebSearch", "mcp__*"] + [f"{t}({p})" for p in paths for t in tools]
        json.dump({
            "permissions": {"deny": deny},
            "sandbox": {
                "enabled": True,
                "allowUnsandboxedCommands": False,
                "filesystem": {"allowWrite": [os.environ["UV_DIR"] + "/**"]},
                "network": {"allowedDomains": ["pypi.org", "files.pythonhosted.org"], "strictAllowlist": True},
            },
        }, open(sys.argv[1], "w"), indent=1)' "$settings"
        cat "$settings"; echo
        echo "settings=$settings" >> "$GITHUB_OUTPUT"
        echo "uv_dir=$uv_dir" >> "$GITHUB_OUTPUT"

    - name: Audit the harness
      id: audit
      if: steps.mode.outputs.mode == 'audit'
      uses: anthropics/claude-code-action@v1
      with:
        prompt: "/harness-stocktake:harness-stocktake --project ."
        plugin_marketplaces: ${{ steps.plugin.outputs.dir }}
        plugins: "harness-stocktake@harness-stocktake"
        display_report: "true"
        claude_code_oauth_token: ${{ inputs.claude_code_oauth_token }}
        anthropic_api_key: ${{ inputs.anthropic_api_key }}
        github_token: ${{ inputs.github_token }}
        claude_args: ${{ inputs.claude_args }}
        settings: ${{ steps.sandbox.outputs.settings }}
      env:
        # uv writes under the sandbox's one extra writable directory (the plugin sits in ~/.claude).
        UV_CACHE_DIR: ${{ steps.sandbox.outputs.uv_dir }}/cache
        UV_PROJECT_ENVIRONMENT: ${{ steps.sandbox.outputs.uv_dir }}/venv

    - name: Update the tracked issue
      id: sync
      if: ${{ !cancelled() && steps.mode.outputs.mode == 'audit' }}
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github_token }}
        EVENT_NAME: ${{ github.event_name }}
        PLUGIN_REF: ${{ inputs.plugin_ref }}
        EXECUTION_FILE: ${{ steps.audit.outputs.execution_file }}
      run: |
        # A pull_request run checks the PR's harness; the issue tracks the default branch.
        extra=()
        if [ "$EVENT_NAME" = "pull_request" ]; then extra=(--no-issue); fi
        python3 -I "$GITHUB_ACTION_PATH/scripts/stocktake.py" audit-sync \
          --workspace "$GITHUB_WORKSPACE" --plugin-ref "$PLUGIN_REF" \
          --execution-file "$EXECUTION_FILE" "${extra[@]}"

    - name: Apply the ticked items
      id: apply
      if: steps.prepare.outputs.apply == 'true'
      uses: anthropics/claude-code-action@v1
      with:
        prompt: >-
          /harness-stocktake:harness-stocktake --project . apply

          The author approved .notes/stocktake/${{ steps.prepare.outputs.run_date }}/report.md through the
          tracked issue; its decision column holds every decision (accept or skip).

          This run is a GitHub Actions job, not a local session. When you finish, the Action pushes
          the commits on your stocktake/<date> branch to `claude/stocktake` and opens or updates one
          pull request. The author merging that pull request is the approval: it stands in for
          Phase 5's GO, the rebase and the ff-only merge. Nothing runs after the merge, so an item
          Phase 4 would hold for "after merge" is pending here. Run Phase 4, then stop: do not merge,
          rebase or push, and keep the branch.

          This run's deny rules block Edit, Write, MultiEdit and NotebookEdit on .claude/, .mcp.json,
          .claude.json, .git, .vscode and .devcontainer, in your worktree too. When an
          item needs such an edit, do not write the file another way: leave it unchanged and record
          the item as pending, with the exact unified diff you would have applied.

          Before you reply, write ${{ github.workspace }}/.notes/stocktake/${{ steps.prepare.outputs.run_date }}/outcomes.json
          (that absolute path, in the main checkout, not in your worktree; do not commit it):
          a JSON object with one key per accepted item id, each value
          {"outcome": "applied" | "reevaluated" | "pending" | "skipped", "note": "<one or two
          sentences>", "diff": "<the unified diff for a pending item, else empty>"}.

          Then reply with Phase 5's completion report, written for the pull request's reader: the
          commits, every pending item with its question and its diff, every applied_diff, and every
          decision made on the author's behalf. Do not mention worktree paths, the ff-only merge,
          pushing, or what happens after a GO; the Action and the merge cover those.
        plugin_marketplaces: ${{ steps.plugin.outputs.dir }}
        plugins: "harness-stocktake@harness-stocktake"
        display_report: "true"
        claude_code_oauth_token: ${{ inputs.claude_code_oauth_token }}
        anthropic_api_key: ${{ inputs.anthropic_api_key }}
        github_token: ${{ inputs.github_token }}
        claude_args: ${{ inputs.claude_args }}
        settings: ${{ steps.sandbox.outputs.settings }}
      env:
        # uv writes under the sandbox's one extra writable directory (the plugin sits in ~/.claude).
        UV_CACHE_DIR: ${{ steps.sandbox.outputs.uv_dir }}/cache
        UV_PROJECT_ENVIRONMENT: ${{ steps.sandbox.outputs.uv_dir }}/venv

    - name: Push claude/stocktake and open or update the PR
      id: publish
      if: steps.prepare.outputs.apply == 'true'
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github_token }}
        RUN_DATE: ${{ steps.prepare.outputs.run_date }}
        DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        EXECUTION_FILE: ${{ steps.apply.outputs.execution_file }}
        ISSUE_NUMBER: ${{ steps.prepare.outputs.issue_number }}
      run: |
        git fetch -q origin "$DEFAULT_BRANCH"
        python3 -I "$GITHUB_ACTION_PATH/scripts/stocktake.py" apply-publish \
          --run-date "$RUN_DATE" --default-branch "$DEFAULT_BRANCH" --execution-file "$EXECUTION_FILE" \
          --issue-number "$ISSUE_NUMBER" --workspace "$GITHUB_WORKSPACE"

    - name: Record a failed apply in the tracked issue
      if: ${{ failure() && steps.prepare.outputs.apply == 'true' }}
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github_token }}
        ISSUE_NUMBER: ${{ steps.prepare.outputs.issue_number }}
      run: |
        python3 -I "$GITHUB_ACTION_PATH/scripts/stocktake.py" mark-failed --message "apply failed" \
          --issue-number "$ISSUE_NUMBER"
